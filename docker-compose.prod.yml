# ─── PRODUCTION ───────────────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.prod.yml up -d
#
# Deployment: Coolify, single VPS (~$20-25/month target).
# Coolify handles reverse proxy (SSL termination, routing) — no nginx/caddy here.
# All env vars are injected by Coolify's environment panel, not a checked-in file.
#
# Key differences from dev:
#   - Source code baked into the image (Dockerfile prod target) — no bind mounts
#   - Pre-built images from GHCR (no local build step)
#   - Managed Postgres and Redis via Coolify (not in compose)
#   - psycopg3 in-process connection pooling (replaces the PgBouncer sidecar).
#     Pooling requires CONN_MAX_AGE=0 — the pool holds connections, not Django.
#     Total connections ≈ (gunicorn/celery processes) × DB_POOL_MAX_SIZE;
#     keep that product below the managed Postgres connection limit.
#   - restart: unless-stopped on all services
#   - Memory limits sized for a budget 2-4 vCPU / 4-8 GB VPS
#   - Two consolidated Celery workers (not six) — see MOHAJON.md for rationale
# ─────────────────────────────────────────────────────────────────────────────

services:

    # ── Django ASGI web server ────────────────────────────────────────────────
    # Gunicorn manages worker lifecycle (graceful restart, SIGTERM handling).
    # UvicornWorker handles ASGI protocol — ready for Django Channels when wired.
    web:
        image: ghcr.io/fardeenes7/mahajon-server:latest
        restart: unless-stopped
        ports:
            - "8001:8000" # Coolify reverse-proxy connects here
        environment:
            DEBUG: "False"
            SECRET_KEY: ${SECRET_KEY}
            ALLOWED_HOSTS: ${ALLOWED_HOSTS}
            CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
            CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
            WEB_URL: ${WEB_URL}
            # Pooling requires CONN_MAX_AGE=0 — psycopg3's pool keeps the
            # connections alive, so Django's per-request persistence is off.
            CONN_MAX_AGE: "0"
            DB_POOL_ENABLED: "True"
            # Gunicorn runs 4 processes, each with its own pool → 4 × 10 = 40 max.
            DB_POOL_MIN_SIZE: ${WEB_DB_POOL_MIN_SIZE:-2}
            DB_POOL_MAX_SIZE: ${WEB_DB_POOL_MAX_SIZE:-10}
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            CELERY_BROKER_URL: ${CELERY_BROKER_URL}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
            AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
            AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}
            CDN_BASE_URL: ${CDN_BASE_URL}
            EMAIL_HOST: ${EMAIL_HOST}
            EMAIL_PORT: ${EMAIL_PORT}
            EMAIL_USE_TLS: ${EMAIL_USE_TLS}
            EMAIL_HOST_USER: ${EMAIL_HOST_USER}
            EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
            SENTRY_DSN: ${SENTRY_DSN:-}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
            META_APP_ID: ${META_APP_ID:-}
            META_APP_SECRET: ${META_APP_SECRET:-}
            META_OAUTH_REDIRECT_URI: ${META_OAUTH_REDIRECT_URI:-}
            # Required — secures the Meta webhook endpoint
            META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
            GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
        deploy:
            resources:
                limits:
                    memory: 1g

    # ── Celery worker — general queues ────────────────────────────────────────
    # Handles: default, high_priority, media_processing
    # Concurrency 4 — prefork processes, safe for mixed CPU/IO tasks.
    celery_worker:
        image: ghcr.io/fardeenes7/mahajon-server:latest
        command: celery -A mohajon worker -l info -Q default,high_priority,media_processing,messenger --concurrency 4
        restart: unless-stopped
        environment:
            DEBUG: "False"
            SECRET_KEY: ${SECRET_KEY}
            CONN_MAX_AGE: "0"
            DB_POOL_ENABLED: "True"
            # Prefork: concurrency 4 = 4 single-threaded child processes, each
            # with its own pool. One connection per child is enough; 2 gives
            # headroom → 4 × 2 = 8 max.
            DB_POOL_MIN_SIZE: ${WORKER_DB_POOL_MIN_SIZE:-1}
            DB_POOL_MAX_SIZE: ${WORKER_DB_POOL_MAX_SIZE:-2}
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            CELERY_BROKER_URL: ${CELERY_BROKER_URL}
            AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
            AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
            AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL}
            AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME}
            AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME}
            CDN_BASE_URL: ${CDN_BASE_URL}
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            META_APP_ID: ${META_APP_ID:-}
            META_APP_SECRET: ${META_APP_SECRET:-}
            META_WEBHOOK_VERIFY_TOKEN: ${META_WEBHOOK_VERIFY_TOKEN}
            SENTRY_DSN: ${SENTRY_DSN:-}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        deploy:
            resources:
                limits:
                    memory: 768m

    # ── Celery worker — AI queues (I/O-bound) ─────────────────────────────────
    # Handles: ai_rag, ai_copy, ai_image
    # Thread pool: tasks wait on OpenAI API calls — threads avoid fork overhead
    # and share the parent process memory (OpenAI client singleton, etc.).
    # Concurrency 4 is safe since GIL doesn't hurt pure-I/O workloads.
    celery_worker_ai:
        image: ghcr.io/fardeenes7/mahajon-server:latest
        command: celery -A mohajon worker -l info -Q ai_rag,ai_copy,ai_image --concurrency 4 --pool threads
        restart: unless-stopped
        environment:
            DEBUG: "False"
            SECRET_KEY: ${SECRET_KEY}
            CONN_MAX_AGE: "0"
            DB_POOL_ENABLED: "True"
            # Threads share ONE process pool (unlike prefork, where each child
            # gets its own), so max_size must exceed concurrency — 6 for 4
            # threads leaves headroom instead of timing out at the boundary.
            DB_POOL_MIN_SIZE: ${AI_WORKER_DB_POOL_MIN_SIZE:-2}
            DB_POOL_MAX_SIZE: ${AI_WORKER_DB_POOL_MAX_SIZE:-6}
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            CELERY_BROKER_URL: ${CELERY_BROKER_URL}
            OPENAI_API_KEY: ${OPENAI_API_KEY}
            SENTRY_DSN: ${SENTRY_DSN:-}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        deploy:
            resources:
                limits:
                    memory: 1g

    # ── Celery Beat ───────────────────────────────────────────────────────────
    celery_beat:
        image: ghcr.io/fardeenes7/mahajon-server:latest
        command: celery -A mohajon beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
        restart: unless-stopped
        environment:
            DEBUG: "False"
            SECRET_KEY: ${SECRET_KEY}
            CONN_MAX_AGE: "0"
            DB_POOL_ENABLED: "True"
            DB_POOL_MIN_SIZE: ${BEAT_DB_POOL_MIN_SIZE:-1}
            DB_POOL_MAX_SIZE: ${BEAT_DB_POOL_MAX_SIZE:-2}
            DATABASE_URL: ${DATABASE_URL}
            REDIS_URL: ${REDIS_URL}
            CELERY_BROKER_URL: ${CELERY_BROKER_URL}
            SENTRY_DSN: ${SENTRY_DSN:-}
            SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-0.1}
        deploy:
            resources:
                limits:
                    memory: 256m
